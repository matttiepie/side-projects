# =============================================================================
# nginx as a LOAD BALANCER in front of the "web" replicas.
# Users hit nginx on port 80 (published as localhost:8080); nginx forwards
# each request to one of the web containers on the private compose network.
# =============================================================================

upstream taskboard {
    # "web" is the compose service name. With 3 replicas, Docker's DNS returns
    # 3 IPs for "web" and nginx load-balances across all of them.
    # NOTE: nginx looks this up ONCE at startup. After scaling up/down, run:
    #   docker compose restart lb
    #
    # max_fails / fail_timeout = passive health check: if a replica fails
    # 2 requests, nginx stops sending it traffic for 10 seconds.
    server web:8080 max_fails=2 fail_timeout=10s;

    # Default algorithm is round robin. Try swapping in one of these:
    # least_conn;   # send to the replica with the fewest active connections
    # ip_hash;      # "sticky sessions": same client IP -> same replica
}

server {
    listen 80;

    location / {
        proxy_pass http://taskboard;

        # If a replica is down, retry the request on the next one
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;

        # Pass the original client info through to the app
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Debug header: shows which replica (container IP) answered.
        # See it with:  curl -i http://localhost:8080/api/info
        add_header X-Served-By $upstream_addr always;
    }
}
